[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "phantomstalker"
version = "0.1.0"
description = "Термінальний компаньйон з піксельним ШІ-фантомом — твій соціальний ко-пілот."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Phantom" }]
keywords = ["tui", "textual", "claude", "crm", "terminal"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "textual>=2.0",
    "rich>=13.7",
    "anthropic>=2.0",
    "keyring>=25.0",
    "httpx>=0.27",  # мережа для self-footprint (v0.2)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
phantomstalker = "phantomstalker.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/phantomstalker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
